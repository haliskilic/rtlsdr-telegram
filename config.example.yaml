# ============================================================================
#  rtlsdr-telegram — Example configuration (English)
#  Copy this file to "config.yaml" and fill in the Telegram section.
#  Turkish version with Turkish comments: config.example.tr.yaml
#  Every key you leave out gets a safe default (see rtlsdr_telegram/config.py).
# ============================================================================

platform: auto                      # auto | linux | raspberrypi | windows
language: en                        # Telegram message language: en | tr
timezone: Europe/Istanbul           # local time zone; messages also show UTC

# -------------------------------------------------- Station location (required)
# Used for satellite/ISS pass prediction and distance/bearing in messages.
station:
  name: "My RTL-SDR Station"
  lat: 41.0082                      # latitude (degrees)
  lon: 28.9784                      # longitude (degrees)
  alt_m: 50                         # altitude (metres)

# -------------------------------------------------------------- Telegram
telegram:
  token: "PUT_YOUR_BOT_TOKEN_HERE"  # from @BotFather
  chat_id: -1001234567890           # group id (supergroups start with -100...)
  thread_id: 0                      # topic id; ALL events go to this single topic (0 = General)
  admins:                           # only these user ids may run commands
    - 123456789
  commands_from_any_topic: true     # accept commands from any topic of the group
  allow_private_admin_commands: true# admins may also command the bot in a private chat
  min_interval_s: 2.0               # minimum gap between messages (flood protection)
  quiet_priority_from: 4            # priority >= this is sent silently (emergencies are always loud)
  startup_message: true             # post a status message on start/stop
  heartbeat_hours: 0                # >0: short "alive" message every N hours
  proxy: ""                         # e.g. "socks5://127.0.0.1:9050"

# ------------------------------------------------------------------ SDR
sdr:
  device_index: 0
  serial: ""                        # select by serial when several dongles are present
  sample_rate: 2400000
  gain: 40                          # dB, or "auto" for AGC
  ppm: 0                            # frequency correction (measure with rtl_test -p)
  bias_tee: false                   # antenna power (supported dongles only)

# ------------------------------------------------------ Scheduler (one dongle)
scheduler:
  min_slot_s: 10
  pass_lead_s: 30                   # start a satellite pass this many seconds early
  boost_minutes: 30                 # how long /priority keeps a target in front
  no_device_retry_s: 60             # retry interval when the dongle is missing
  adhoc_default_s: 120              # default /scan duration

# --------------------------------------------------- Blacklist (FM/TV included)
# These ranges are never scanned. Add your own.
blacklist:
  - {name: "FM broadcast", start_mhz: 87.5, end_mhz: 108.0}
  - {name: "VHF band III TV/DAB", start_mhz: 174.0, end_mhz: 240.0}
  - {name: "UHF TV (DVB-T2)", start_mhz: 470.0, end_mhz: 694.0}

# ------------------------------------------------------- Transcription (feature A)
transcription:
  engine: faster_whisper            # faster_whisper | whisper | api | none
  model: base                       # tiny | base | small | medium (bigger = better, slower)
  device: cpu                       # cpu | cuda
  compute_type: int8                # int8 (CPU) | float16 (GPU)
  language: auto                    # auto | tr | en  (per target: transcribe_language)
  vad: true                         # silence filter
  beam_size: 1
  api:                              # for engine=api (OpenAI compatible)
    base_url: "https://api.openai.com/v1"
    api_key: ""
    model: "whisper-1"
  prompts: {}                       # optional vocabulary hints per category key (aviation, maritime ...)

# ---------------------------------------------------------------- Audio
audio:
  format: ogg                       # ogg (opus, recommended) | mp3 | wav
  opus_bitrate: "24k"
  keep_wav: false                   # also keep the raw WAV

# ------------------------------------------------------- Daily summary (feature B)
summary:
  enabled: true
  time: "09:00"                     # local time
  attach_csv: true                  # attach the event export as CSV
  top_n: 5

# ------------------------------------------------------------------ Paths / retention
paths:
  data_dir: "./data"
  recordings_dir: "./data/recordings"
  log_dir: "./logs"
  retention_days: 30                # circular retention: older recordings/events are deleted
  retention_months: 0               # >0 overrides days (e.g. 6)
  retention_years: 0                # >0 overrides days (e.g. 1)
  min_free_disk_pct: 10             # below this free space: prune oldest recordings, pause recording, warn
  tool_log_max_mb: 5                # per-tool logs (adsb.log ...) rotate at this size
  db_vacuum_days: 30                # SQLite VACUUM interval
  log_level: INFO                   # DEBUG | INFO | WARNING

# -------------------------------------------------------------- Satellites / TLE
satellites:
  tle_urls:                         # tried in order ({norad} placeholder)
    - "https://tle.ivanstanojevic.me/api/tle/{norad}"
    - "https://celestrak.org/NORAD/elements/gp.php?CATNR={norad}&FORMAT=tle"
  tle_max_age_h: 24
  tle_retry_min: 30
  refresh_min: 60

# ============================================================================
#  TARGETS
#  Common keys: enabled, priority (0 = highest), dwell_s (listening time per slot),
#  period_s (desired repeat interval). Only frequently changed keys are shown;
#  every other key has a default (see the DEFAULTS in each target module).
# ============================================================================
targets:

  # 1) Aircraft (ADS-B 1090 MHz) — readsb
  adsb:
    enabled: true
    priority: 3
    dwell_s: 90
    period_s: 300
    gain: auto
    low_alt_ft: 3000                # below this altitude = "low altitude"
    report_mode: summary            # summary: one message per slot | each: every new aircraft
    report_nearby_km: 8             # new/low aircraft within this distance always get their own message

  # 2) ACARS/VDL2 (aircraft data messages) — acarsdec + dumpvdl2
  acars:
    enabled: true
    dwell_s: 60
    period_s: 600
    acars: {enabled: true, freqs_mhz: [131.525, 131.725, 131.825]}
    vdl2:  {enabled: true, freqs_mhz: [136.725, 136.775, 136.875, 136.975]}
    max_events_per_slot: 15

  # 3) Vessels (AIS) — AIS-catcher
  ais:
    enabled: true
    dwell_s: 90
    period_s: 300
    report_mode: summary            # summary | each
    report_nearby_km: 5             # new vessels within this distance get their own message
    # AIS-SART / MOB / EPIRB-AIS (MMSI 970/972/974) always raise an EMERGENCY alarm

  # 4) Radiosondes (400–406 MHz) — detection + optional radiosonde_auto_rx telemetry
  radiosonde:
    enabled: true
    dwell_s: 45
    period_s: 600
    auto_rx:
      enabled: false                # true: read radiosonde_auto_rx log files (full decoding)
      log_dir: "/opt/radiosonde_auto_rx/auto_rx/log"

  # 5) ISM sensors (433.92 / 868 MHz) — rtl_433
  ism:
    enabled: true
    dwell_s: 60
    period_s: 300
    freqs_mhz: [433.92, 868.0]
    report_readings: false          # true: also report every reading (many messages)
    individual_max: 2               # up to N new devices per slot individually, the rest as one summary

  # 6) APRS (144.800 MHz) — multimon-ng
  aprs:
    enabled: true
    dwell_s: 45
    period_s: 300

  # 7) Distress beacons (406 / 121.5 MHz) — HIGHEST PRIORITY
  emergency:
    enabled: true
    priority: 0
    period_s: 240
    dwell_406_s: 25                 # continuous 406 MHz sweep (beacons transmit every ~50 s)
    dwell_121_s: 10
    watch_406: true
    watch_121_5: true
    record_121_5: true

  # 8) GSM cell inventory — gr-gsm (cell IDENTITIES only, no content)
  gsm:
    enabled: true
    priority: 6
    dwell_s: 300                    # the whole-band scan must finish within the dwell (~90 s idle, 2-3x under CPU load)
    period_s: 3600
    bands: [GSM900]                 # add DCS1800 with dwell_s: 420 or more
    speed: 27                       # grgsm_scanner --speed (0–29, higher = faster)

  # 9) Amateur radio voice (144–146 / 430–440 MHz) — FM, VOX
  amateur_voice:
    enabled: true
    dwell_s: 90
    period_s: 300
    threshold_dbfs: -42             # VOX threshold (dBFS)
    # The following apply to all voice targets (amateur_voice/airband/marine_voice/cb_pmr):
    # scan_ranges: [{start_mhz: 144.0, end_mhz: 146.0, step_khz: 12.5}]  # band sweep; active channels first
    # scan_threshold_db: 10         # "active channel" = this many dB above the noise floor
    # scan_max_channels: 3          # at most N channels from the sweep
    # require_dynamics: true        # reject flat-level segments (static / carriers)
    # min_dynamics_db: 2.5          # speech dynamics threshold; raise to reject more static
    # squelch: 0                    # rtl_fm hardware squelch (0 = off); calibrate with your antenna
    transcribe_language: null       # null = auto detect, or "tr" / "en"
    channels:
      - {freq_mhz: 145.500}         # names come from the built-in channel plans
      - {freq_mhz: 433.500}

  # 10) Airband (118–137 MHz) — AM
  airband:
    enabled: true
    dwell_s: 90
    period_s: 300
    threshold_dbfs: -38
    transcribe_language: en         # aviation English
    channels:
      - {freq_mhz: 121.500}         # Guard; add your local tower/approach frequencies here

  # 11) Marine VHF (156–162 MHz) — FM, channel 16 prioritized
  marine_voice:
    enabled: true
    dwell_s: 90
    period_s: 300
    threshold_dbfs: -40
    transcribe_language: null
    channels:
      - {freq_mhz: 156.800}         # Channel 16
      - {freq_mhz: 156.650}         # Channel 13

  # 12) CB / PMR446 (26–28 / 446 MHz) — FM
  cb_pmr:
    enabled: true
    dwell_s: 60
    period_s: 360

  # 13) Meteor-M weather satellite (LRPT 137 MHz) — SatDump (image per pass)
  meteor:
    enabled: true
    priority: 2
    min_elevation: 20
    gain: 42
    satellites:
      - {name: "METEOR-M2 3", norad: 57166, freq_mhz: 137.9, pipeline: "meteor_m2-x_lrpt"}
      - {name: "METEOR-M2 4", norad: 59051, freq_mhz: 137.1, pipeline: "meteor_m2-x_lrpt_80k"}

  # 14) ISS (145.800/145.825 MHz) — voice/SSTV/packet during passes
  iss:
    enabled: true
    priority: 2
    min_elevation: 15
    mode: voice                     # voice | sstv | aprs
    transcribe_language: en
    sstv_decoder_cmd: ""            # e.g. "sstv -d {wav} -o {outdir}/img.png" when installed

  # 15) Inmarsat STD-C/AERO (~1.5 GHz) — EXTRA HARDWARE (L-band antenna + LNA)
  inmarsat:
    enabled: false                  # leave off without the hardware
    active: false                   # true: hardware present, try to listen
    freq_mhz: 1541.45
    gain: 49
    decoder_cmd: ""                 # e.g. SatDump: "satdump live inmarsat_std_c /tmp/stdc --source rtlsdr --samplerate 1e6 --frequency {freq_hz} --gain {gain} --bias --timeout 600"

  # 16) Spectrum sweep and anomaly detection (24–1766 MHz, FM/TV excluded)
  spectrum:
    enabled: true
    dwell_s: 120
    period_s: 600
    bin_khz: 25
    threshold_db: 10                # this many dB above the learned baseline = anomaly
    learn_scans: 3                  # the first N sweeps only learn (no alarms)
    waterfall: true                 # focused waterfall image per anomaly
    repeat_min: 60                  # the same anomaly is reported again at most every N minutes
    # One ~200 MHz sub-range is swept per slot; ~7 slots cover the whole spectrum.
